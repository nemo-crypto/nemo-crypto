<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Nemo — Full-Stack Developer and Web3 Builder</title>
<desc id="desc">A dark terminal-inspired banner connecting web, mobile, backend, blockchain data, and agent automation.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#14152d"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".055"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="438" rx="24" fill="url(#bg)" stroke="#334155"/>
<rect x="1" y="1" width="1198" height="438" rx="24" fill="url(#grid)"/>
<path d="M36 2H1164" stroke="url(#accent)" stroke-width="3"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<circle cx="42" cy="34" r="5" fill="#fb7185"/><circle cx="62" cy="34" r="5" fill="#fbbf24"/><circle cx="82" cy="34" r="5" fill="#5eead4"/>
<text x="108" y="39" fill="#94a3b8" font-size="13">nemo@github: ~/build-something</text>
<text x="1156" y="39" text-anchor="end" fill="#5eead4" font-size="12">FULL STACK / FULL CURIOSITY</text>
<path d="M32 58H1168" stroke="#273449"/>
<text x="48" y="109" fill="#5eead4" font-size="16">$ whoami</text>
<text x="44" y="199" fill="#f1f5f9" font-size="84" font-weight="800" letter-spacing="-5">Hey, I'm Nemo<tspan fill="#5eead4">.</tspan></text>
<text x="48" y="244" fill="#c4b5fd" font-size="22" font-weight="700">FULL-STACK DEVELOPER / WEB3 BUILDER</text>
<text x="48" y="287" fill="#cbd5e1" font-size="17">From pixels to pipelines. From wallets to workflows.</text>
<text x="48" y="315" fill="#94a3b8" font-size="15">I ship the interface. And the services behind it.</text>
<rect x="48" y="354" width="130" height="32" rx="16" fill="#102c2d" stroke="#24504e"/>
<text x="113" y="375" text-anchor="middle" fill="#5eead4" font-size="12">COFFEE → CODE</text>
<text x="199" y="375" fill="#94a3b8" font-size="12">professional debugger, occasionally by choice</text>
<rect x="813" y="91" width="339" height="296" rx="14" fill="#0b1220" stroke="#334155"/>
<text x="835" y="122" fill="#64748b" font-size="12">// the stack, connected</text>
<path d="M837 139H1128" stroke="#273449"/>
<text x="835" y="173" fill="#5eead4" font-size="15">01  WEB + MOBILE</text>
<text x="871" y="197" fill="#94a3b8" font-size="12">Next / Nuxt / Flutter / RN</text>
<text x="835" y="233" fill="#93c5fd" font-size="15">02  SERVICES + DATA</text>
<text x="871" y="257" fill="#94a3b8" font-size="12">Go / Rust / Node.js</text>
<text x="835" y="293" fill="#c4b5fd" font-size="15">03  CHAIN + AUTOMATION</text>
<text x="871" y="317" fill="#94a3b8" font-size="12">Web3 / market feeds / agents</text>
<path d="M837 339H1128" stroke="#273449"/>
<text x="835" y="365" fill="#64748b" font-size="12">&gt; build. debug. ship. repeat.</text>
</g></svg>
