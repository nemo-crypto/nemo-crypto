<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Nemo — Full Stack. On Chain. Beyond the Browser.</title>
<desc id="desc">An animated cyber console with neon orbital paths, connected stack nodes, looping neon fireworks, and a decorative market waveform. Full-stack development, mobile apps, blockchain data, and agent automation.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#060b16"/><stop offset=".6" stop-color="#0c1027"/><stop offset="1" stop-color="#140c29"/></linearGradient>
  <linearGradient id="neon"><stop stop-color="#42f8d0"/><stop offset=".5" stop-color="#63b3ff"/><stop offset="1" stop-color="#d27bff"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#7353ff" stop-opacity=".25"/><stop offset="1" stop-color="#7353ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="core"><stop stop-color="#1f3149"/><stop offset="1" stop-color="#0a1326"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8498cb" stroke-opacity=".065"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect x="1" y="1" width="1198" height="518" rx="24"/></clipPath>
</defs>
<style>
  .orbit{transform-origin:958px 253px;animation:spin 42s linear infinite}
  .reverse{animation-direction:reverse;animation-duration:58s}
  .pulse{animation:pulse 4s ease-in-out infinite}
  .flow{stroke-dasharray:6 16;animation:flow 12s linear infinite}
  .cursor{animation:blink 1.8s steps(2,end) infinite}
  .firework{pointer-events:none}
  .spark{opacity:0;animation:spark 7.2s cubic-bezier(.15,.6,.35,1) infinite;animation-delay:var(--delay)}
  .burst-ring{opacity:0;animation:burst-ring 7.2s ease-out infinite;animation-delay:var(--delay)}
  .rocket{opacity:0;animation:launch 7.2s ease-out infinite;animation-delay:var(--delay)}
  @keyframes launch{0%{opacity:0;transform:translateY(110px)}3%{opacity:.85}12%{opacity:.95;transform:translateY(0)}15%,100%{opacity:0;transform:translateY(0)}}
  @keyframes spark{0%,12%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1;transform:translate(0,0) scale(1.2)}34%{opacity:.9}48%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
  @keyframes burst-ring{0%,13%{opacity:0;transform:scale(.05)}16%{opacity:.65}38%,100%{opacity:0;transform:scale(1)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{opacity:.45}}
  @keyframes flow{to{stroke-dashoffset:-220}}
  @keyframes blink{50%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.orbit,.pulse,.flow,.cursor,.spark,.burst-ring,.rocket{animation:none}.firework{display:none}}
</style>
