<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="558" viewBox="0 0 1200 558" role="img" aria-labelledby="title desc">
<title id="title">Nemo’s animated full-stack modules</title>
<desc id="desc">Four decorative looping visualizations: a web rendering scanner, mobile signal pulses, streaming chain data packets, and an agent workflow. These are illustrations, not live metrics.</desc>
<defs>
  <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#0e1a2e"/><stop offset="1" stop-color="#090e1d"/></linearGradient>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#526b96" opacity=".24"/></pattern>
  <linearGradient id="scan"><stop stop-color="#42f8d0" stop-opacity="0"/><stop offset="1" stop-color="#42f8d0" stop-opacity=".35"/></linearGradient>
  <clipPath id="web-clip"><rect x="26" y="177" width="538" height="46" rx="5"/></clipPath>
</defs>
<style>
  .edge{stroke-dasharray:12 88;animation:edge 12s linear infinite;animation-delay:var(--offset)}
  .scanner{animation:scan 5s ease-in-out infinite}
  .signal{transform-box:fill-box;transform-origin:center;animation:signal 3.6s ease-out infinite;animation-delay:var(--offset)}
  .packets{stroke-dasharray:5 22;animation:packets 4s linear infinite}
  .node{animation:node 4.8s ease-in-out infinite;animation-delay:var(--offset)}
  .meter{transform-box:fill-box;transform-origin:center bottom;animation:meter 3s ease-in-out infinite;animation-delay:var(--offset)}
  @keyframes edge{to{stroke-dashoffset:-100}}
  @keyframes scan{0%,100%{transform:translateX(0);opacity:0}10%,85%{opacity:1}90%,100%{transform:translateX(540px)}}
  @keyframes signal{0%{transform:scale(.5);opacity:0}20%{opacity:.8}100%{transform:scale(1.5);opacity:0}}
  @keyframes packets{to{stroke-dashoffset:-108}}
  @keyframes node{0%,100%{opacity:.4}25%,45%{opacity:1}}
  @keyframes meter{0%,100%{transform:scaleY(.35);opacity:.5}50%{transform:scaleY(1);opacity:1}}
  @media(prefers-reduced-motion:reduce){.edge,.scanner,.signal,.packets,.node,.meter{animation:none}.scanner,.signal{display:none}}
</style>
